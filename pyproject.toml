[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microfluidic-control-system"
version = "0.1.0"
description = "Microfluidic droplet control system with PySide6 frontend and backend orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-contrib-python>=4.8",
    "pyserial>=3.5",
    "PySide6>=6.8",
]

[project.optional-dependencies]
industrial-camera = [
    "harvesters>=1.4",
]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["pytest-cache-files-*", ".test_tmp", "tmp"]

[tool.ruff]
target-version = "py310"
line-length = 120

[project.scripts]
microfluidic-control = "run:main"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["frontend*", "backend*"]
exclude = ["frontend.pages*", "frontend.components*", "backend.vision.legacy*"]
