name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m compileall -q backend frontend tests
      - run: python -m ruff check backend frontend run.py --select E9,F63,F7,F82
      - run: python -m mypy backend/orchestrator/safety.py backend/vision/calibration.py
      - run: python -m coverage run --source=backend,frontend -m pytest tests -q
      - run: python -m coverage report --fail-under=20
